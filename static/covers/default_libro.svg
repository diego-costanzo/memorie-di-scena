<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2e18" />
      <stop offset="50%" stop-color="#361f0d" />
      <stop offset="100%" stop-color="#241306" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e197" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8323" />
      <stop offset="100%" stop-color="#694d0e" />
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Copertina in cuoio con dorso a sinistra -->
  <rect x="0" y="0" width="320" height="480" rx="8" fill="url(#leatherGrad)" />
  
  <!-- Linea dorso libro -->
  <line x1="22" y1="0" x2="22" y2="480" stroke="#1d1004" stroke-width="3" opacity="0.6"/>
  <line x1="25" y1="0" x2="25" y2="480" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Cornice dorata esterna -->
  <rect x="36" y="20" width="264" height="440" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Cornice dorata interna sottile -->
  <rect x="42" y="26" width="252" height="428" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,3" />

  <!-- Decorazioni angolari classiche -->
  <!-- Alto-Sinistra -->
  <path d="M 46 46 L 66 46 M 46 46 L 46 66" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <!-- Alto-Destra -->
  <path d="M 290 46 L 270 46 M 290 46 L 290 66" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <!-- Basso-Sinistra -->
  <path d="M 46 434 L 66 434 M 46 434 L 46 414" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <!-- Basso-Destra -->
  <path d="M 290 434 L 270 434 M 290 434 L 290 414" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

  <!-- Emblema centrale Libro Classico -->
  <g transform="translate(168, 175) scale(1.15)">
    <!-- Cerchio medaglione -->
    <circle cx="0" cy="0" r="48" fill="#2d190b" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5" />
    
    <!-- Icona Libro aperto -->
    <path d="M -26 -12 C -14 -16 -4 -12 0 -7 C 4 -12 14 -16 26 -12 L 26 18 C 14 14 4 17 0 22 C -4 17 -14 14 -26 18 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round" />
    <path d="M 0 -7 L 0 22" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M -22 -4 C -13 -7 -5 -4 0 0" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
    <path d="M -22 3 C -13 0 -5 3 0 7" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
    <path d="M 22 -4 C 13 -7 5 -4 0 0" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
    <path d="M 22 3 C 13 0 5 3 0 7" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Testo in oro antico con font serif -->
  <text x="168" y="275" font-family="'Georgia', 'Palatino', serif" font-size="16" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    MEMORIE DI SCENA
  </text>
  
  <line x1="85" y1="290" x2="251" y2="290" stroke="url(#goldGrad)" stroke-width="1" />
  <circle cx="168" cy="290" r="3" fill="url(#goldGrad)" />
  
  <text x="168" y="325" font-family="'Georgia', 'Palatino', serif" font-size="20" font-weight="bold" fill="#f5e197" text-anchor="middle" letter-spacing="2">
    LIBRO
  </text>

  <text x="168" y="352" font-family="'Georgia', 'Palatino', serif" font-size="13" font-style="italic" fill="#cbb382" text-anchor="middle">
    Volume della Collezione
  </text>

  <!-- Fregio inferiore -->
  <g transform="translate(168, 410)">
    <path d="M -30 0 Q 0 -8 30 0 Q 0 8 -30 0 Z" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGrad)"/>
  </g>
</svg>

