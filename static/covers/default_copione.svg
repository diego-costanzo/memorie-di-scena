<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="theatreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e1a22" />
      <stop offset="50%" stop-color="#380e15" />
      <stop offset="100%" stop-color="#20060b" />
    </linearGradient>
    <linearGradient id="goldGradTheatre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb3" />
      <stop offset="40%" stop-color="#dfb943" />
      <stop offset="70%" stop-color="#b88d2a" />
      <stop offset="100%" stop-color="#735212" />
    </linearGradient>
  </defs>

  <!-- Copertina bordeaux scuro teatrale -->
  <rect x="0" y="0" width="320" height="480" rx="8" fill="url(#theatreGrad)" />
  
  <!-- Linea dorso -->
  <line x1="22" y1="0" x2="22" y2="480" stroke="#150306" stroke-width="3" opacity="0.7"/>
  <line x1="25" y1="0" x2="25" y2="480" stroke="url(#goldGradTheatre)" stroke-width="1" opacity="0.35"/>

  <!-- Cornici dorate -->
  <rect x="36" y="20" width="264" height="440" rx="4" fill="none" stroke="url(#goldGradTheatre)" stroke-width="2.5" />
  <rect x="42" y="26" width="252" height="428" rx="2" fill="none" stroke="url(#goldGradTheatre)" stroke-width="1" stroke-dasharray="5,3" />

  <!-- Decorazioni angolari -->
  <path d="M 46 46 L 66 46 M 46 46 L 46 66" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>
  <path d="M 290 46 L 270 46 M 290 46 L 290 66" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>
  <path d="M 46 434 L 66 434 M 46 434 L 46 414" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>
  <path d="M 290 434 L 270 434 M 290 434 L 290 414" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>

  <!-- Emblema centrale Maschere Teatrali -->
  <g transform="translate(168, 175) scale(1.15)">
    <!-- Medaglione -->
    <circle cx="0" cy="0" r="48" fill="#26080d" stroke="url(#goldGradTheatre)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#goldGradTheatre)" stroke-width="0.8" opacity="0.5" />
    
    <!-- Maschera Commedia (sinistra) -->
    <path d="M -22 -14 C -12 -22 -2 -14 -6 10 C -9 22 -20 22 -24 10 Z" 
          fill="none" stroke="url(#goldGradTheatre)" stroke-width="2.2" />
    <!-- Occhi sorridenti -->
    <circle cx="-18" cy="-3" r="2" fill="url(#goldGradTheatre)"/>
    <circle cx="-10" cy="-3" r="2" fill="url(#goldGradTheatre)"/>
    <!-- Bocca che ride -->
    <path d="M -18 8 Q -14 14 -10 8" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>

    <!-- Maschera Tragedia (destra) -->
    <path d="M 6 -8 C 10 -20 22 -16 24 14 C 22 24 11 24 8 14 Z" 
          fill="none" stroke="url(#goldGradTheatre)" stroke-width="2.2" />
    <!-- Occhi tristi -->
    <circle cx="12" cy="0" r="2" fill="url(#goldGradTheatre)"/>
    <circle cx="20" cy="0" r="2" fill="url(#goldGradTheatre)"/>
    <!-- Bocca ingiù -->
    <path d="M 12 14 Q 16 9 20 14" stroke="url(#goldGradTheatre)" stroke-width="2" fill="none"/>
  </g>

  <!-- Testo oro teatrale -->
  <text x="168" y="275" font-family="'Georgia', 'Palatino', serif" font-size="16" font-weight="bold" fill="url(#goldGradTheatre)" text-anchor="middle" letter-spacing="4">
    MEMORIE DI SCENA
  </text>
  
  <line x1="85" y1="290" x2="251" y2="290" stroke="url(#goldGradTheatre)" stroke-width="1" />
  <circle cx="168" cy="290" r="3" fill="url(#goldGradTheatre)" />
  
  <text x="168" y="325" font-family="'Georgia', 'Palatino', serif" font-size="20" font-weight="bold" fill="#fcedb3" text-anchor="middle" letter-spacing="2">
    COPIONE
  </text>

  <text x="168" y="352" font-family="'Georgia', 'Palatino', serif" font-size="13" font-style="italic" fill="#dbc59c" text-anchor="middle">
    Copione di Scena &amp; Spettacoli
  </text>

  <!-- Fregio inferiore -->
  <g transform="translate(168, 410)">
    <path d="M -30 0 Q 0 -8 30 0 Q 0 8 -30 0 Z" fill="url(#goldGradTheatre)" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGradTheatre)"/>
  </g>
</svg>

