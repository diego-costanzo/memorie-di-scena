<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="vinylBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a231d" />
      <stop offset="50%" stop-color="#1c1611" />
      <stop offset="100%" stop-color="#0f0c09" />
    </linearGradient>
    <linearGradient id="goldGradVinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc0" />
      <stop offset="40%" stop-color="#d9b44a" />
      <stop offset="70%" stop-color="#ab8424" />
      <stop offset="100%" stop-color="#694f10" />
    </linearGradient>
    <radialGradient id="vinylShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <!-- Copertina scura vinile classico -->
  <rect x="0" y="0" width="320" height="480" rx="8" fill="url(#vinylBg)" />
  
  <!-- Linea dorso -->
  <line x1="22" y1="0" x2="22" y2="480" stroke="#090705" stroke-width="3" opacity="0.8"/>
  <line x1="25" y1="0" x2="25" y2="480" stroke="url(#goldGradVinyl)" stroke-width="1" opacity="0.35"/>

  <!-- Cornici dorate esterne -->
  <rect x="36" y="20" width="264" height="440" rx="4" fill="none" stroke="url(#goldGradVinyl)" stroke-width="2.5" />
  <rect x="42" y="26" width="252" height="428" rx="2" fill="none" stroke="url(#goldGradVinyl)" stroke-width="1" stroke-dasharray="5,3" />

  <!-- Decorazioni angolari classiche -->
  <path d="M 46 46 L 66 46 M 46 46 L 46 66" stroke="url(#goldGradVinyl)" stroke-width="2" fill="none"/>
  <path d="M 290 46 L 270 46 M 290 46 L 290 66" stroke="url(#goldGradVinyl)" stroke-width="2" fill="none"/>
  <path d="M 46 434 L 66 434 M 46 434 L 46 414" stroke="url(#goldGradVinyl)" stroke-width="2" fill="none"/>
  <path d="M 290 434 L 270 434 M 290 434 L 290 414" stroke="url(#goldGradVinyl)" stroke-width="2" fill="none"/>

  <!-- Disco Vinile Centrale con Solchi -->
  <g transform="translate(168, 175)">
    <!-- Corpo del disco -->
    <circle cx="0" cy="0" r="76" fill="#14100c" stroke="url(#goldGradVinyl)" stroke-width="2" />
    <circle cx="0" cy="0" r="76" fill="url(#vinylShine)" />

    <!-- Solchi sonori concentrici -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#2e251e" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#251e18" stroke-width="1" opacity="0.7" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#2e251e" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#251e18" stroke-width="1" opacity="0.7" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#2e251e" stroke-width="1" opacity="0.6" />

    <!-- Etichetta dorata centrale (Label) -->
    <circle cx="0" cy="0" r="34" fill="#38210d" stroke="url(#goldGradVinyl)" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#goldGradVinyl)" stroke-width="0.8" opacity="0.7" />
    
    <!-- Chiave di Violino / Nota Musicale -->
    <!-- Foro centrale -->
    <circle cx="0" cy="0" r="6" fill="#14100c" stroke="url(#goldGradVinyl)" stroke-width="1.5" />

    <!-- Note musicali ornamentali -->
    <g transform="translate(-14, -18) scale(0.7)">
      <ellipse cx="6" cy="16" rx="4" ry="3" fill="url(#goldGradVinyl)" transform="rotate(-20 6 16)" />
      <ellipse cx="26" cy="12" rx="4" ry="3" fill="url(#goldGradVinyl)" transform="rotate(-20 26 12)" />
      <rect x="9" y="4" width="2" height="12" fill="url(#goldGradVinyl)" />
      <rect x="29" y="0" width="2" height="12" fill="url(#goldGradVinyl)" />
      <polygon points="9,4 31,0 31,4 9,8" fill="url(#goldGradVinyl)" />
    </g>
  </g>

  <!-- Testo in oro antico con font serif -->
  <text x="168" y="280" font-family="'Georgia', 'Palatino', serif" font-size="16" font-weight="bold" fill="url(#goldGradVinyl)" text-anchor="middle" letter-spacing="4">
    MEMORIE DI SCENA
  </text>
  
  <line x1="85" y1="295" x2="251" y2="295" stroke="url(#goldGradVinyl)" stroke-width="1" />
  <circle cx="168" cy="295" r="3" fill="url(#goldGradVinyl)" />
  
  <text x="168" y="330" font-family="'Georgia', 'Palatino', serif" font-size="20" font-weight="bold" fill="#faecc0" text-anchor="middle" letter-spacing="2">
    CD &amp; VINILI
  </text>

  <text x="168" y="356" font-family="'Georgia', 'Palatino', serif" font-size="13" font-style="italic" fill="#d2b885" text-anchor="middle">
    Musica &amp; Registrazioni Sonore
  </text>

  <!-- Fregio inferiore -->
  <g transform="translate(168, 412)">
    <path d="M -30 0 Q 0 -8 30 0 Q 0 8 -30 0 Z" fill="url(#goldGradVinyl)" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGradVinyl)"/>
  </g>
</svg>

